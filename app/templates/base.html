<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}双 VCF 变异核对{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f7fa; --card: #ffffff; --ink: #1f2933; --muted: #6b7280;
      --line: #e3e8ef; --accent: #2563eb; --accent-soft: #dbeafe;
      --ok: #047857; --ok-soft: #d1fae5; --warn: #b45309; --warn-soft: #fef3c7;
      --bad: #b91c1c; --bad-soft: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header p { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 24px; margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }
    h2 { font-size: 18px; margin: 0 0 14px; }
    label.field { display: block; margin-bottom: 16px; font-weight: 600; }
    label.field span.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
    input[type=file] {
      display: block; width: 100%; margin-top: 6px; padding: 10px;
      border: 1px dashed var(--line); border-radius: 8px; background: #fafbfc;
    }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 11px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .alert {
      border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
      border: 1px solid; font-weight: 600;
    }
    .alert.error { background: var(--bad-soft); border-color: #fca5a5; color: var(--bad); }
    .rules { color: var(--muted); font-size: 13.5px; }
    .rules ul { margin: 8px 0 0; padding-left: 20px; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .pill {
      background: var(--accent-soft); color: #1e40af; border-radius: 999px;
      padding: 4px 12px; font-size: 13px; font-weight: 600;
    }
    .summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .stat { flex: 1 1 160px; border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); background: #fafbfc; }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat .lbl { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
    .tag.SNV { background: #e0e7ff; color: #3730a3; }
    .tag.INS { background: var(--ok-soft); color: var(--ok); }
    .tag.DEL { background: #ffedd5; color: #c2410c; }
    .dose { font-weight: 700; }
    .dose.d2 { color: var(--bad); }
    .dose.d1 { color: var(--warn); }
    .muted { color: var(--muted); }
    .raw { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .section-badge {
      display: inline-block; border-radius: 999px; padding: 2px 10px;
      font-size: 12.5px; font-weight: 700; margin-left: 8px; vertical-align: middle;
    }
    .b-ok { background: var(--ok-soft); color: var(--ok); }
    .b-warn { background: var(--warn-soft); color: var(--warn); }
    .b-bad { background: var(--bad-soft); color: var(--bad); }
    .empty { color: var(--muted); padding: 14px 4px; }
    a.back { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>双 VCF 变异核对</h1>
    <p>同一参考、同一样本，两套变异识别程序结果复查工具</p>
  </header>
  {% block body %}{% endblock %}
</div>
</body>
</html>
